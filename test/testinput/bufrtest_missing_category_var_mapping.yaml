# Test case to verify error message when category variable is missing

bufr:
  variables:
    timestamp:
      datetime:
        year: "*/YEAR"
        month: "*/MNTH"
        day: "*/DAYS"
        hour: "*/HOUR"
        minute: "*/MINU"
        second: "*/SECO"
    longitude:
      query: "*/CLON"
    latitude:
      query: "*/CLAT"
    brightnessTemperature:
      query: "[*/BRITCSTC/TMBR, */BRIT/TMBR]"

  splits:
    satId:
      category:
        variable: satellite_id  # This variable is NOT defined in variables section

encoder:
  dimensions:
    - name: "Channel"
      path: "*/BRITCSTC"

  variables:
    - name: "MetaData/dateTime"
      source: variables/timestamp
      longName: "dateTime"
      units: "seconds since 1970-01-01T00:00:00Z"

    - name: "MetaData/latitude"
      source: variables/latitude
      longName: "Latitude"
      units: "degrees_north"
      range: [-90, 90]

    - name: "MetaData/longitude"
      source: variables/longitude
      longName: "Longitude"
      units: "degrees_east"
      range: [-180, 180]

    - name: "ObsValue/brightnessTemperature"
      coordinates: "longitude latitude Channel"
      source: variables/brightnessTemperature
      longName: "Radiance"
      units: "K"
      range: [120, 500]
      chunks: [1000, 15]
      compressionLevel: 4
