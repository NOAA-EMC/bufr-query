name: CI

on:
  push:
    branches: [ "**" ]
    # branches: [ develop ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Cache Docker Image
      uses: actions/cache@v3
      with:
        path: /tmp/.docker-cache
        key: docker-${{ runner.os }}-jcsda/docker-gnu-openmpi-dev
        restore-keys: |
          docker-${{ runner.os }}-

    - name: Load Cached Docker Image
      run: |
        mkdir -p /tmp/.docker-cache
        if [ -f /tmp/.docker-cache/jcsda/docker-gnu-openmpi-dev.tar ]; then
          docker load -i /tmp/.docker-cache/jcsda/docker-gnu-openmpi-dev.tar || true
        fi

    - name: Pull or Use Cached Image
      run: |
        docker pull jcsda/docker-gnu-openmpi-dev:latest || true
        mkdir -p /tmp/.docker-cache/jcsda/
        docker save -o /tmp/.docker-cache/jcsda/docker-gnu-openmpi-dev.tar jcsda/docker-gnu-openmpi-dev:latest

    - name: Checkout repository
      uses: actions/checkout@v2
      with:
        submodules: recursive

    - name: Build in Docker
      run: |
        docker run --rm \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace \
          jcsda/docker-gnu-openmpi-dev:latest \
          /bin/bash -c "
            mkdir -p build &&
            cd build &&
            cmake .. &&
            make -j$(nproc)
          "

    - name: Install nccmp in docker from source with cmake
      run: |
        docker run --rm \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace \
          jcsda/docker-gnu-openmpi-dev:latest \
          /bin/bash -c "
            git clone https://gitlab.com/remikz/nccmp.git
            cd nccmp
            mkdir -p build &&
            cd build &&
            cmake .. &&
            make -j$(nproc)
            make install
            nccmp --version
          "

    - name: Check for NetCDF installation
      if: false
      run: |
        set -e
        echo "Checking for NetCDF installation..."
        if ! ldconfig -p | grep -q netcdf; then
          echo "NetCDF libraries NOT found."
          exit 1
        fi
        if ! find /usr/include /usr/local/include -name netcdf.h 2>/dev/null | grep -q netcdf.h; then
          echo "NetCDF headers NOT found."
          exit 1
        fi
        if ! command -v nc-config >/dev/null 2>&1; then
          echo "nc-config utility NOT found."
          exit 1
        fi
        echo "NetCDF installation looks good!"
        nc-config --all
      continue-on-error: true

    - name: Install prerequisites for nccmp
      if: false
      run: |
        docker run --rm \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace \
          jcsda/docker-gnu-openmpi-dev:latest \
          /bin/bash -c "
            set -e -x
            apt-get update 
            apt-get install -y \
              git autoconf automake libtool \
              netcdf-bin libnetcdf-dev \
              libhdf5-dev \
              libcurl4-openssl-dev \
              zlib1g-dev libzstd-dev libbrotli-dev \
              libssl-dev build-essential
            export LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu:/usr/lib/x86_64-linux-gnu/hdf5/serial:$LD_LIBRARY_PATH
            export PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig:$PKG_CONFIG_PATH
          "

    - name: Test environment
      if: false
      run: |
        docker run --rm \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace \
          jcsda/docker-gnu-openmpi-dev:latest \
          echo -e '#include <stdio.h>\nint main() { printf("Test\\n"); return 0; }' > tttest.c && \
          gcc -o tttest tttest.c && \
          ./tttest

    - name: Install nccmp from source
      if: false
      run: |
        docker run --rm \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace \
          jcsda/docker-gnu-openmpi-dev:latest \
          /bin/bash -c "
            git clone https://gitlab.com/remikz/nccmp.git
            cd nccmp
            autoreconf -fiv
            ./configure \
              CPPFLAGS=\"$(nc-config --cflags) -I/usr/include/hdf5/serial\" \
              LDFLAGS=\"$(nc-config --libs) -L/usr/lib/x86_64-linux-gnu/hdf5/serial -L/usr/lib/x86_64-linux-gnu -lcurl -lz -lzstd -lbrotli -lssl -lcrypto\" \
              --with-netcdf=/usr || cat config.log
            make -j$(nproc)
            make install
            nccmp --version
          "

    - name: Test in Docker
      run: |
        docker run --rm \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace/build \
          jcsda/docker-gnu-openmpi-dev:latest \
          /bin/bash -c "
            ctest --output-on-failure
          "

