name: CI

on:
  push:
    branches: [ "**" ]
    # branches: [ develop ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Cache Docker Image
      uses: actions/cache@v3
      with:
        path: /tmp/.docker-cache
        key: docker-${{ runner.os }}-jcsda/docker-gnu-openmpi-dev
        restore-keys: |
          docker-${{ runner.os }}-

    - name: Load Cached Docker Image
      run: |
        mkdir -p /tmp/.docker-cache
        if [ -f /tmp/.docker-cache/jcsda/docker-gnu-openmpi-dev.tar ]; then
          docker load -i /tmp/.docker-cache/jcsda/docker-gnu-openmpi-dev.tar || true
        fi

    - name: Pull or Use Cached Image
      run: |
        docker pull jcsda/docker-gnu-openmpi-dev:latest || true
        mkdir -p /tmp/.docker-cache/jcsda/
        docker save -o /tmp/.docker-cache/jcsda/docker-gnu-openmpi-dev.tar jcsda/docker-gnu-openmpi-dev:latest

    - name: Checkout repository
      uses: actions/checkout@v2
      with:
        submodules: recursive

    - name: Build bufr_query in the container
      if: true
      run: |
        docker run --rm \
          -v /home/runner/work/bufr-query/bufr-query:/workspace \
          -w /workspace \
          jcsda/docker-gnu-openmpi-dev:latest \
          /bin/bash -c "
            # Install python3-dev and dependencies
            apt-get update && apt-get install -y python3-dev python3-pip || true
            # Update PATH
            export PATH=\$PATH:/opt/views/view/bin:/usr/local/bin:/usr/bin:/bin
            export PYTHONPATH=/opt/views/view/lib/python3.11/site-packages
            echo PATH
            echo \$PATH
            echo PYTHONPATH
            echo \$PYTHONPATH
            # Set Python variables
            PYTHON_BIN=\$(which python3)
            PYTHON_INCLUDE_DIR=\$(python3 -c 'import sysconfig; print(sysconfig.get_path(\"include\"))' 2>/dev/null || find / -name 'Python.h' 2>/dev/null | head -n1 | xargs dirname)
            PYTHON_LIBRARY=\$(find / -name 'libpython3.11.so' 2>/dev/null | head -n1 || python3 -c 'import sysconfig; print(sysconfig.get_config_var(\"LIBDIR\") + \"/libpython3.11.so\")' 2>/dev/null)
            echo PYTHON_BIN
            echo \$PYTHON_BIN
            echo PYTHON_INCLUDE_DIR
            echo \$PYTHON_INCLUDE_DIR
            echo PYTHON_LIBRARY
            echo \$PYTHON_LIBRARY
            # Verify Python version
            python3 --version || echo 'python3 version failed'
            python3 -c 'import sys; print(sys.version_info)' || echo 'Python version info failed'
            # Build with CMake
            mkdir -p build
            cd build
            rm -rf CMakeCache.txt CMakeFiles  # Clear cache
            cmake .. \
              -DPython3_ROOT_DIR=/opt/views/view \
              -DPython3_EXECUTABLE=\$PYTHON_BIN \
              -DPython3_INCLUDE_DIR=\$PYTHON_INCLUDE_DIR \
              -DPython3_LIBRARY=\$PYTHON_LIBRARY \
              -DPython3_FIND_STRATEGY=LOCATION \
              -DPython3_FIND_FRAMEWORK=LAST
            make
          "
      shell: /usr/bin/bash --noprofile --norc -e -o pipefail {0}

    - name: Install nccmp in docker from source with cmake
      run: |
        docker run --rm \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace \
          jcsda/docker-gnu-openmpi-dev:latest \
          /bin/bash -c "
            git clone https://gitlab.com/remikz/nccmp.git
            cd nccmp
            mkdir -p build &&
            cd build &&
            cmake .. &&
            make -j$(nproc)
            make install
            nccmp --version
          "

    - name: install wxflow
      if: false
      run: |
        docker run --rm \
          -v /home/runner/work/bufr-query/bufr-query:/workspace \
          -w /workspace \
          jcsda/docker-gnu-openmpi-dev:latest \
          /bin/bash -c "
            # Install dependencies
            # apt-get update && apt-get install -y  libyaml-cpp-dev || true
            # pip3 install pybind11 pyyaml || true
            pip3 install wxflow
            python3 -c 'import wxflow; print(wxflow.__version__)' || echo 'wxflow not found'
          "
      shell: /usr/bin/bash --noprofile --norc -e -o pipefail {0}


    - name: Test in Docker
      if: true
      run: |
        docker run --rm \
              -v /home/runner/work/bufr-query/bufr-query:/workspace \
              -w /workspace/build \
              jcsda/docker-gnu-openmpi-dev:latest \
              /bin/bash -c "
                set -e -x
                pip3 install wxflow
                python3 -m site
                # Set wxflow path
                export PYTHONPATH=/opt/views/view/lib/python3.11/site-packages:$PYTHONPATH
                # Create non-root user with a different UID if 1000 is taken
                id -u testuser || useradd -m -u 1001 -s /bin/bash testuser
                chown -R testuser:testuser /workspace
                # Run tests as non-root user, explicitly preserve environment
                su testuser -c 'export PATH=$PATH; export LD_LIBRARY_PATH=$LD_LIBRARY_PATH; export PYTHONPATH=$PYTHONPATH; ctest --output-on-failure'
              "
            shell: /usr/bin/bash -e {0}


    
    - name: old Test in Docker
      if: false
      run: |
        docker run --rm \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace/build \
          jcsda/docker-gnu-openmpi-dev:latest \
          /bin/bash -c "
            set -e -x
            pip3 install wxflow
            python3 -m site
            # set wxflow path
            export PYTHONPATH=/opt/views/view/lib/python3.11/site-packages:$PYTHONPATH
            
            # Run tests as non-root user, preserve environment
            useradd -m -u 1000 -s /bin/bash testuser
            chown -R testuser:testuser /workspace
            su testuser -p -c 'ctest --output-on-failure'
                
            # ctest --output-on-failure
          "

