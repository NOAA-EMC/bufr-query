name: CI

on:
  push:
    branches: [ "**" ]
    # branches: [ develop ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Cache Docker Image
      uses: actions/cache@v3
      with:
        path: /tmp/.docker-cache
        key: docker-${{ runner.os }}-jcsda/docker-gnu-openmpi-dev
        restore-keys: |
          docker-${{ runner.os }}-

    - name: Load Cached Docker Image
      run: |
        mkdir -p /tmp/.docker-cache
        if [ -f /tmp/.docker-cache/jcsda/docker-gnu-openmpi-dev.tar ]; then
          docker load -i /tmp/.docker-cache/jcsda/docker-gnu-openmpi-dev.tar || true
        fi

    - name: Pull or Use Cached Image
      run: |
        docker pull jcsda/docker-gnu-openmpi-dev:latest || true
        mkdir -p /tmp/.docker-cache/jcsda/
        docker save -o /tmp/.docker-cache/jcsda/docker-gnu-openmpi-dev.tar jcsda/docker-gnu-openmpi-dev:latest

    - name: Checkout repository
      uses: actions/checkout@v2
      with:
        submodules: recursive

    - name: check python3
      run: |
        docker run --rm \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace \
          jcsda/docker-gnu-openmpi-dev:latest \
          /bin/bash -c "
            which python3
            find / -type f -name "python3" 2>/dev/null
            python3 --version
            find / -type f -name "Python.h" 2>/dev/null
            echo $PATH
            echo $PYTHONPATH
          "

    - name: Build inside Docker
      run: |
        docker run --rm \
          -v /home/runner/work/bufr-query/bufr-query:/workspace \
          -w /workspace \
          jcsda/docker-gnu-openmpi-dev:latest \
          /bin/bash -c "
            mkdir -p build
            cd build
            PYTHON_BIN=$(which python3)
            PYTHON_INCLUDE_DIR=$(python3 -c 'from sysconfig import get_paths as gp; print(gp()[\"include\"])')
            PYTHON_LIBRARY=$(find /opt -name 'libpython3.11.so' 2>/dev/null | head -n1)
            cmake .. \
              -DPython3_EXECUTABLE=$PYTHON_BIN \
              -DPython3_INCLUDE_DIR=$PYTHON_INCLUDE_DIR \
              -DPython3_LIBRARY=$PYTHON_LIBRARY
            make -j$(nproc)
          "
      shell: bash

    - name: old Build in Docker
      if: false
      run: |
        docker run --rm \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace \
          jcsda/docker-gnu-openmpi-dev:latest \
          /bin/bash -c "
            mkdir -p build
            cd build
            PYTHON_BIN=$(which python3)
            PYTHON_INCLUDE_DIR=$(python3 -c "from sysconfig import get_paths as gp; print(gp()['include'])")
            PYTHON_LIBRARY=$(find /opt -name "libpython3.11.so" 2>/dev/null | head -n1)
            cmake .. \
              -DPython3_EXECUTABLE="$PYTHON_BIN" \
              -DPython3_INCLUDE_DIR="$PYTHON_INCLUDE_DIR" \
              -DPython3_LIBRARY="$PYTHON_LIBRARY"
            make -j$(nproc)
          "

    - name: Install nccmp in docker from source with cmake
      run: |
        docker run --rm \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace \
          jcsda/docker-gnu-openmpi-dev:latest \
          /bin/bash -c "
            git clone https://gitlab.com/remikz/nccmp.git
            cd nccmp
            mkdir -p build &&
            cd build &&
            cmake .. &&
            make -j$(nproc)
            make install
            nccmp --version
          "

    - name: Test gcc
      if: false
      run: |
        docker run --rm \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace \
          jcsda/docker-gnu-openmpi-dev:latest \
          echo -e '#include <stdio.h>\nint main() { printf("Test\\n"); return 0; }' > tttest.c && \
          gcc -o tttest tttest.c && \
          ./tttest

    - name: Test environment
      run: |
        docker run --rm \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace \
          jcsda/docker-gnu-openmpi-dev:latest \
          /bin/bash -c "
            BUFR_QUERY_ROOT=`pwd`
            export PYTHONPATH=$BUFR_QUERY_ROOT/build/lib/python3.9/site-packages/
            export LD_LIBRARY_PATH=$BUFR_QUERY_ROOT/build/lib:$LD_LIBRARY_PATH
            cd build
            ls
            echo '-----------------------lib--------------------'
            ls -R lib
            echo '====================================================='
            ls lib/python3.9/site-packages/
            echo 'testdata'
            ls test/testdata
            echo 'testinput'
            ls test/testinput
            bin/bufr2netcdf.x test/testdata/gdas.t18z.1bmhs.tm00.bufr_d test/testinput/bufrtest_filtering_mapping.yaml jjj.nc
          "

    - name: Test in Docker
      run: |
        docker run --rm \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace/build \
          jcsda/docker-gnu-openmpi-dev:latest \
          /bin/bash -c "
            ctest --output-on-failure
          "

